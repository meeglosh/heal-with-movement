name = "heal-with-movement"
compatibility_date = "2024-09-25"
pages_build_output_dir = "public"

# No account_id is set here on purpose — this repo is not tied to a specific
# Cloudflare account file. Select the account interactively at deploy time
# (see DEPLOY.md): `wrangler login`, then `wrangler pages deploy public --project-name=heal-with-movement`
# (run from site/) and pick the GAPCO LLC account when prompted, or pass
# --account-id explicitly on the command line if you want to skip the prompt.
#
# Pages Functions (site/functions/) are picked up automatically because
# they live at the Pages project root (site/), a sibling of the build
# output directory (public/), not inside it.
